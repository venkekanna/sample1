<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShopNow - Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <a href="products.html" class="btn btn-link">&larr; Back to products</a>
  <div class="row">
    <div class="col-md-6">
      <img id="detail-img" src="assets/images/hero-banner.png" class="img-fluid" alt="product">
    </div>
    <div class="col-md-6">
      <h2 id="detail-name">Product Name</h2>
      <p id="detail-desc">Product description</p>
      <h4 id="detail-price">$9.99</h4>
      <button id="addCartBtn" class="btn btn-primary">Add to cart</button>
    </div>
  </div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
